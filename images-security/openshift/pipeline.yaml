apiVersion: v1
kind: Namespace
metadata:
  name: images-security
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: security-demo
  namespace: images-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-image-builder
  namespace: images-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: images-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-rhhi-deployer
  namespace: images-security
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, get, patch, update, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, get, patch, update]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [create, get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-rhhi-deployer
  namespace: images-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-rhhi-deployer
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: images-security
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: images-security
  namespace: images-security
spec:
  params:
    - name: variant
      type: string
      description: community, ubi or rhhi
    - name: maven-profile
      type: string
      default: none
      description: none or unsafe
    - name: image
      type: string
    - name: rox-endpoint
      type: string
      default: central.rhacs-operator.svc.cluster.local:443
    - name: rox-cluster
      type: string
      default: my-cluster
    - name: roxctl-image
      type: string
      default: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9:4.11.4
    - name: rox-insecure-tls
      type: string
      default: "true"
  workspaces:
    - name: source
  tasks:
    - name: fetch
      taskSpec:
        workspaces:
          - name: source
        volumes:
          - name: archive
            configMap:
              name: images-security-source
        steps:
          - name: unpack
            image: registry.access.redhat.com/ubi9/ubi:latest
            volumeMounts:
              - name: archive
                mountPath: /archive
            script: |
              #!/usr/bin/env sh
              set -eu
              tar -xzf /archive/source.tgz -C "$(workspaces.source.path)"
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter: [fetch]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.image)
        - name: CONTEXT
          value: images-security
        - name: DOCKERFILE
          value: images-security/containers/Containerfile.$(params.variant)
        - name: BUILD_EXTRA_ARGS
          value: --pull=true --build-arg MAVEN_PROFILE=$(params.maven-profile)
        - name: TLS_VERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: source
    - name: image-scan
      runAfter: [build]
      params:
        - name: image
          value: $(params.image)
        - name: endpoint
          value: $(params.rox-endpoint)
        - name: cluster
          value: $(params.rox-cluster)
        - name: roxctl-image
          value: $(params.roxctl-image)
        - name: insecure-tls
          value: $(params.rox-insecure-tls)
      taskSpec:
        params:
          - name: image
            type: string
          - name: endpoint
            type: string
          - name: cluster
            type: string
          - name: roxctl-image
            type: string
          - name: insecure-tls
            type: string
        steps:
          - name: scan
            image: $(params.roxctl-image)
            env:
              - name: ROX_API_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: rox-api-token
                    key: token
            script: |
              #!/usr/bin/env sh
              set -eu
              tls=""
              if [ "$(params.insecure-tls)" = "true" ]; then tls="--insecure-skip-tls-verify"; fi
              roxctl image scan --endpoint "$(params.endpoint)" \
                --cluster "$(params.cluster)" --namespace "$(context.taskRun.namespace)" \
                --image "$(params.image)" --force -o table $tls
    - name: image-check
      runAfter: [image-scan]
      params:
        - name: image
          value: $(params.image)
        - name: endpoint
          value: $(params.rox-endpoint)
        - name: cluster
          value: $(params.rox-cluster)
        - name: roxctl-image
          value: $(params.roxctl-image)
        - name: insecure-tls
          value: $(params.rox-insecure-tls)
      taskSpec:
        params:
          - name: image
            type: string
          - name: endpoint
            type: string
          - name: cluster
            type: string
          - name: roxctl-image
            type: string
          - name: insecure-tls
            type: string
        steps:
          - name: policy-gate
            image: $(params.roxctl-image)
            env:
              - name: ROX_API_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: rox-api-token
                    key: token
            script: |
              #!/usr/bin/env sh
              set -eu
              tls=""
              if [ "$(params.insecure-tls)" = "true" ]; then tls="--insecure-skip-tls-verify"; fi
              roxctl image check --endpoint "$(params.endpoint)" \
                --cluster "$(params.cluster)" --namespace "$(context.taskRun.namespace)" \
                --image "$(params.image)" --force -o table $tls
    - name: deploy-rhhi
      runAfter: [image-check]
      when:
        - input: $(params.variant)
          operator: in
          values: [rhhi]
      params:
        - name: image
          value: $(params.image)
        - name: digest
          value: $(tasks.build.results.IMAGE_DIGEST)
      taskSpec:
        params:
          - name: image
            type: string
          - name: digest
            type: string
        workspaces:
          - name: source
        steps:
          - name: deploy
            image: quay.io/openshift/origin-cli:4.22
            script: |
              #!/usr/bin/env sh
              set -eu
              image_ref="$(params.image)@$(params.digest)"
              manifest="$(workspaces.source.path)/images-security/openshift/rhhi-deployment.yaml"
              sed "s|IMAGE_REFERENCE|${image_ref}|g" "$manifest" | oc apply -f -
              oc -n "$(context.taskRun.namespace)" rollout status \
                deployment/security-demo-rhhi --timeout=180s
              oc -n "$(context.taskRun.namespace)" get route security-demo-rhhi \
                -o jsonpath='https://{.spec.host}/vulnerabilities{"\n"}'
          - name: smoke-test
            image: registry.access.redhat.com/ubi9/openjdk-17:latest
            script: |
              #!/usr/bin/env sh
              set -eu
              url="http://security-demo-rhhi.$(context.taskRun.namespace).svc.cluster.local:8080/vulnerabilities"
              body=$(curl --fail --silent --show-error "$url")
              echo "$body" | grep -q '"app":"images-security-demo"'
              echo "Smoke test aprovado: $body"
      workspaces:
        - name: source
          workspace: source
