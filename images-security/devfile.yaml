schemaVersion: 2.3.0
metadata:
  name: images-security
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/admin-devspaces/images-security-devtools:latest
      command: ["tail", "-f", "/dev/null"]
      memoryLimit: 3Gi
      mountSources: true
commands:
  - id: show-dependencies
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}/images-security/app
      commandLine: mvn -B dependency:tree -Punsafe
  - id: build-safe
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}/images-security/app
      commandLine: mvn -B package -DskipTests
  - id: build-unsafe
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}/images-security/app
      commandLine: mvn -B -Punsafe package -DskipTests
