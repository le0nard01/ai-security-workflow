apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: quarkus-vuln-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-image-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: pipeline
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: quarkus-vulnerable-app-build
spec:
  params:
    - name: git-url
      type: string
      description: Git repository containing this project.
    - name: git-revision
      type: string
      default: main
      description: Git revision to build.
    - name: context-dir
      type: string
      default: resources/apps/quarkus-vulnerable-app
      description: Directory containing the Quarkus app.
    - name: destination-image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/quarkus-vuln-demo:latest
      description: Image pushed into the OpenShift local registry.
    - name: hardened-runtime-image
      type: string
      default: registry.access.redhat.com/hi/openjdk:latest-runtime
      description: Red Hat Hardened Image used as the runtime base.
    - name: builder-image
      type: string
      default: registry.access.redhat.com/ubi9/openjdk-17:latest
      description: Red Hat OpenJDK builder image used to compile the application.
    - name: rox-central-endpoint
      type: string
      description: RHACS Central endpoint, for example central-stackrox.apps.example.com:443.
    - name: rox-api-token-secret
      type: string
      default: rox-api-token
      description: Secret containing the RHACS API token in the token key.
    - name: rox-insecure-skip-tls-verify
      type: string
      default: "false"
      description: Set to true when RHACS Central uses a certificate not trusted by the roxctl image.
    - name: roxctl-image
      type: string
      default: registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel8:latest
      description: Image containing the roxctl CLI.
  workspaces:
    - name: source
  tasks:
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: source
    - name: build-and-push
      runAfter:
        - fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.destination-image)
        - name: CONTEXT
          value: $(params.context-dir)
        - name: DOCKERFILE
          value: $(params.context-dir)/src/main/docker/Containerfile.hardened
        - name: TLSVERIFY
          value: "false"
        - name: BUILD_EXTRA_ARGS
          value: "--pull=true --build-arg BUILDER_IMAGE=$(params.builder-image) --build-arg RUNTIME_IMAGE=$(params.hardened-runtime-image)"
      workspaces:
        - name: source
          workspace: source
    - name: roxctl-image-check
      runAfter:
        - build-and-push
      taskSpec:
        params:
          - name: image
            type: string
          - name: rox-central-endpoint
            type: string
          - name: rox-api-token-secret
            type: string
          - name: rox-insecure-skip-tls-verify
            type: string
          - name: roxctl-image
            type: string
        steps:
          - name: image-check
            image: $(params.roxctl-image)
            env:
              - name: ROX_API_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.rox-api-token-secret)
                    key: token
            script: |
              #!/usr/bin/env sh
              set -eu

              tls_args=""
              if [ "$(params.rox-insecure-skip-tls-verify)" = "true" ]; then
                tls_args="--insecure-skip-tls-verify"
              fi

              roxctl image check \
                --endpoint "$(params.rox-central-endpoint)" \
                ${tls_args} \
                -c Custom \
                --image "$(params.image)" \
                --cluster local-cluster
      params:
        - name: image
          value: $(params.destination-image)
        - name: rox-central-endpoint
          value: $(params.rox-central-endpoint)
        - name: rox-api-token-secret
          value: $(params.rox-api-token-secret)
        - name: rox-insecure-skip-tls-verify
          value: $(params.rox-insecure-skip-tls-verify)
        - name: roxctl-image
          value: $(params.roxctl-image)
